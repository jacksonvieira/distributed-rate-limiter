# Spreads requests round-robin over the gateway instances.
upstream gateways {
    server gateway-1:8080;
    server gateway-2:8080;
    server gateway-3:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://gateways;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keeps the caller's W3C trace context so the trace continues through the gateways.
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        # Lets you see which instance answered.
        add_header X-Upstream $upstream_addr always;
    }
}
