apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      volumes:
        - { name: tmp, emptyDir: {} }
      containers:
        - name: gateway
          image: {{ include "ratelimiter.image" (dict "root" . "name" "gateway") }}
          ports:
            - containerPort: 8080
          env:
            - { name: GATEWAY_ROUTE_PATHPREFIX, value: {{ .Values.gateway.routePathPrefix | quote }} }
            - { name: GATEWAY_ROUTE_URI, value: {{ .Values.gateway.routeUri | quote }} }
            - { name: GATEWAY_RATELIMIT_STORE, value: redis }
            - { name: GATEWAY_RATELIMIT_REDIS_URI, value: {{ .Values.redis.uri | quote }} }
            - { name: GATEWAY_RATELIMIT_KEY, value: {{ .Values.gateway.keyStrategy | quote }} }
            - { name: GATEWAY_ADMINAPI_ENABLED, value: "true" }
            - { name: GATEWAY_ADMINAPI_URL, value: "http://admin-api:8090" }
            - name: GATEWAY_ADMINAPI_APIKEY
              valueFrom:
                secretKeyRef: { name: {{ include "ratelimiter.secretName" . }}, key: admin-api-key }
            - { name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT, value: "" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            {{- include "ratelimiter.securityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
spec:
  minAvailable: {{ sub (int .Values.gateway.replicas) 1 | max 1 }}
  selector:
    matchLabels: { app: gateway }
