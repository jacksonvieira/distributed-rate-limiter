apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  labels: { app: admin-api }
spec:
  replicas: {{ .Values.adminApi.replicas }}
  selector:
    matchLabels: { app: admin-api }
  template:
    metadata:
      labels: { app: admin-api }
    spec:
      volumes:
        - { name: tmp, emptyDir: {} }
      containers:
        - name: admin-api
          image: {{ include "ratelimiter.image" (dict "root" . "name" "admin-api") }}
          ports:
            - containerPort: 8090
          env:
            - { name: SPRING_DATASOURCE_URL, value: {{ .Values.postgres.url | quote }} }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "ratelimiter.secretName" . }}, key: postgres-password }
            - name: ADMIN_APIKEY
              valueFrom:
                secretKeyRef: { name: {{ include "ratelimiter.secretName" . }}, key: admin-api-key }
            - { name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT, value: "" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8090 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8090 }
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            {{- include "ratelimiter.securityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            {{- toYaml .Values.adminApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: admin-api
spec:
  selector: { app: admin-api }
  ports:
    - port: 8090
