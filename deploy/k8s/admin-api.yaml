apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  labels: { app: admin-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: admin-api }
  template:
    metadata:
      labels: { app: admin-api }
    spec:
      volumes:
        - { name: tmp, emptyDir: {} }
      containers:
        - name: admin-api
          image: ghcr.io/jacksonvieira/ratelimiter-admin-api
          ports:
            - containerPort: 8090
          env:
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/ratelimiter" }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: ratelimiter, key: postgres-password }
            - name: ADMIN_APIKEY
              valueFrom:
                secretKeyRef: { name: ratelimiter, key: admin-api-key }
            - { name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT, value: "" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8090 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8090 }
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: admin-api
spec:
  selector: { app: admin-api }
  ports:
    - port: 8090
