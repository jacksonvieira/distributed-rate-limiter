apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  replicas: 3
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      containers:
        - name: gateway
          image: ghcr.io/jacksonvieira/ratelimiter-gateway
          ports:
            - containerPort: 8080
          env:
            # Point the route at your own backend service.
            - { name: GATEWAY_ROUTE_PATHPREFIX, value: /api }
            - { name: GATEWAY_ROUTE_URI, value: "http://backend:80" }
            - { name: GATEWAY_RATELIMIT_STORE, value: redis }
            - { name: GATEWAY_RATELIMIT_REDIS_URI, value: "redis://redis:6379" }
            - { name: GATEWAY_RATELIMIT_KEY, value: header }
            - { name: GATEWAY_ADMINAPI_ENABLED, value: "true" }
            - { name: GATEWAY_ADMINAPI_URL, value: "http://admin-api:8090" }
            - name: GATEWAY_ADMINAPI_APIKEY
              valueFrom:
                secretKeyRef: { name: ratelimiter, key: admin-api-key }
            - { name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT, value: "" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: gateway }
