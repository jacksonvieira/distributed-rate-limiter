server:
  port: 8090

spring:
  application:
    name: admin-api
  datasource:
    url: jdbc:postgresql://localhost:5432/ratelimiter
    username: ratelimiter
    password: ratelimiter
  threads:
    virtual:
      enabled: true

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0

logging:
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
